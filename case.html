<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>芝心聊癒｜塔羅個案簿</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&family=Noto+Sans+TC:wght@400;500;700&family=DM+Mono:wght@500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.6.12/lunar.js"></script>
<script>(function(){var srcs=['https://unpkg.com/lunar-javascript@1.6.12/lunar.js'];
function next(){if(typeof Solar!=='undefined'||!srcs.length)return;var s=document.createElement('script');s.src=srcs.shift();s.onload=function(){window.dispatchEvent(new Event('lunarready'))};s.onerror=next;document.head.appendChild(s);}
window.addEventListener('load',function(){setTimeout(next,300)});})();</script>
<style>
:root{
  --bg:#f3f1f6; --panel:#ffffff; --ink:#24203a; --muted:#6c6782;
  --line:#2f3b8f; --accent:#b0833f; --hl:#d0427f; --hl-bg:#fbe8f0;
  --soft:#e9ecf8; --rule:#dcd9e6; --ok:#2f8a55; --warn:#c0661f;
  --s-maj:#b0833f; --s-wand:#d4692a; --s-cup:#2f7fc1; --s-sword:#5a5f86; --s-pent:#2f8a55;
  --c-pre:#e8742a; --c-post:#24a055; --c-main:#e0505a;
  --ring:#5cc08f;--ring-soft:#e8f8ef;--tri-out:#b7e0c8;--tri-in:#3f9a5e;--node:#ffffff;
  --n-left:#3f5a4c;--n-right:#e58a6f;--n-top:#e08a2e;--star:#e0484a;--raw:#2a2a2a;
  --t-mid:#3b7fd6;--t-mid-bg:#eef4fd;--t-young:#4a9a5c;--t-young-bg:#e3f8e9;--t-old:#e0b53c;--t-old-bg:#fdf6dd;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --num:"DM Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#16141f; --panel:#211e2e; --ink:#ece9f5; --muted:#a39fb8;
  --line:#8d9cf0; --accent:#d7ab68; --hl:#f07aaa; --hl-bg:#3a2030;
  --soft:#2b2a40; --rule:#36334a; --ok:#5cc489; --warn:#f0a060;
  --s-maj:#d7ab68; --s-wand:#f0905a; --s-cup:#6fb0ea; --s-sword:#a7abd6; --s-pent:#5cc489;
  --c-pre:#f39553; --c-post:#4cc47a; --c-main:#f07a82;
  --ring:#4fae80;--ring-soft:#1c2e25;--tri-out:#2f5a42;--tri-in:#5cc08f;--node:#211e2e;
  --n-left:#cfe6d8;--n-right:#f2a48c;--n-top:#e8963a;--star:#f07070;--raw:#ece9f5;
  --t-mid:#7fb0f0;--t-mid-bg:#1f2a3d;--t-young:#7cc98e;--t-young-bg:#1d3326;--t-old:#ecc85e;--t-old-bg:#352e18;
  color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding:20px max(16px,env(safe-area-inset-left,0px)) 64px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.3}
h2{font-size:1.15rem}h3{font-size:1rem}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--panel);border:1.5px solid var(--rule);border-radius:10px;padding:9px 11px;width:100%;min-width:0;max-width:100%}
input,select{min-height:44px}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
input[type=checkbox]{-webkit-appearance:auto;appearance:auto;width:20px;height:20px;min-height:0;padding:0;margin:0;flex:none;accent-color:var(--line)}
.ck{display:flex;gap:8px;align-items:center;font-size:.9rem;cursor:pointer}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--line);outline-offset:0;border-color:var(--line)}
label.l{display:block;font-size:.82rem;font-weight:700;color:var(--muted);margin:0 0 4px}
.hint{font-size:.8rem;color:var(--muted);margin:2px 0 0}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:16px}
.btn{border:0;border-radius:999px;padding:9px 18px;font-weight:700;background:var(--soft);color:var(--line)}
.btn.pri{background:var(--line);color:var(--panel)}
.btn.sm{padding:5px 12px;font-size:.85rem}
.btn.ghost{background:transparent;border:1.5px solid var(--rule);color:var(--ink)}
.btn.danger{background:var(--hl-bg);color:var(--hl)}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media (max-width:480px){.grid2.st{grid-template-columns:minmax(0,1fr)}}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.live{padding:4px 0 10px;border-bottom:1px dashed var(--rule)}
.live .cap{font-size:.75rem;color:var(--muted);text-align:center;margin-top:4px}
.feerow{display:flex;gap:8px;align-items:center}
.feerow input{flex:1}
.f{display:flex;flex-direction:column}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--rule);background:var(--panel);border-radius:999px;padding:3px 12px;font-size:.82rem}
.chip[aria-pressed="true"]{background:var(--line);border-color:var(--line);color:var(--panel)}
.tag{display:inline-block;font-size:.75rem;font-weight:700;border-radius:999px;padding:1px 9px;background:var(--soft);color:var(--line)}
.tag.warn{background:var(--hl-bg);color:var(--hl)}
.tag.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.tag.gold{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
.note{font-size:.85rem;color:var(--muted);text-align:center}
.err{color:var(--hl);font-size:.85rem}

/* 封面 */
#cover{min-height:calc(100vh - 90px);display:flex;align-items:center;justify-content:center}
.cv{text-align:center;max-width:360px;width:100%;display:flex;flex-direction:column;align-items:center;gap:14px}
.cv svg{width:150px;height:150px}
.cv .brand{font-size:.9rem;letter-spacing:.3em;color:var(--accent);font-weight:700}
.cv h1{font-size:2rem;font-weight:900;letter-spacing:.08em}
.cv p{margin:0;color:var(--muted);font-size:.9rem}
.cv .pin{display:flex;gap:8px;width:100%}
.cv .pin input{text-align:center;letter-spacing:.4em;font-family:var(--num)}
.cv .go{font-size:1.1rem;padding:12px 44px;letter-spacing:.2em}

/* 列表 */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{font-size:1.3rem}
.iconbtn{border:0;background:var(--soft);color:var(--line);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;font-size:1.05rem;flex:none}
.stat{display:flex;gap:8px}
.stat div{flex:1;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:8px 10px}
.stat b{display:block;font-family:var(--num);font-size:1.15rem;color:var(--line)}
.stat span{font-size:.75rem;color:var(--muted)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.fl{display:flex;flex-direction:column;gap:6px}
.fu{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--soft);border:0;text-align:left;width:100%}
.fu .d{font-family:var(--num);font-size:.8rem;color:var(--muted);flex:none;min-width:52px}
.fu .t{flex:1;min-width:0}
.fu .t b{display:block}
.fu .t span{font-size:.82rem;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fu.late .d{color:var(--hl);font-weight:700}
.months{display:flex;flex-direction:column;gap:8px}
details.mo{background:var(--panel);border:1px solid var(--rule);border-radius:14px}
details.mo>summary{list-style:none;padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
details.mo>summary::-webkit-details-marker{display:none}
details.mo>summary .m{font-family:var(--display);font-weight:900;font-size:1.05rem;min-width:52px}
details.mo>summary .n{color:var(--muted);font-size:.85rem;flex:1}
details.mo>summary::after{content:"›";color:var(--muted);transition:transform .2s;font-size:1.2rem}
details.mo[open]>summary::after{transform:rotate(90deg)}
details.mo.cur>summary .m{color:var(--hl)}
.cl{display:flex;flex-direction:column;gap:6px;padding:0 10px 10px}
.cc{display:flex;gap:12px;align-items:center;border:0;background:var(--soft);border-radius:12px;padding:9px 12px;text-align:left;width:100%}
.av{width:38px;height:38px;border-radius:50%;background:var(--line);color:var(--panel);display:grid;place-items:center;font-family:var(--display);font-weight:900;flex:none}
.cc .t{flex:1;min-width:0}
.cc .t b{font-size:1rem}
.cc .t .s{font-size:.8rem;color:var(--muted)}
.cc .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.bday{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.bday button{flex:none;border:1.5px solid var(--hl);background:var(--hl-bg);color:var(--ink);border-radius:12px;padding:6px 12px;text-align:left}
.bday button small{display:block;color:var(--muted);font-family:var(--num);font-size:.75rem}

/* 個案檔案 */
.ch{display:flex;gap:14px;align-items:center}
.ch .av{width:54px;height:54px;font-size:1.4rem}
.ch h1{font-size:1.4rem}
.tabs{display:flex;background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:4px;gap:4px;position:sticky;top:6px;z-index:5}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 4px;font-weight:700;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--line);color:var(--panel)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
dl.kv dt{color:var(--muted);font-size:.85rem;font-weight:700;white-space:nowrap}
dl.kv dd{margin:0;white-space:pre-wrap;word-break:break-word}
.box{background:var(--soft);border-radius:12px;padding:10px 12px;white-space:pre-wrap;word-break:break-word;min-height:20px}
.tl{display:flex;flex-direction:column;gap:10px;position:relative}
.ss{background:var(--panel);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.ss>summary{list-style:none;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.ss>summary::-webkit-details-marker{display:none}
.ss .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ss .h .d{font-family:var(--num);font-weight:700;color:var(--line)}
.ss .q{font-size:.92rem}
.ss .mini{display:flex;gap:3px;flex-wrap:wrap}
.ss .mini .face{width:26px}
.ss .bd{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px;border-top:1px dashed var(--rule);padding-top:12px}
.ss .lbl{font-size:.8rem;font-weight:700;color:var(--muted);margin-bottom:3px}

/* 牌 */
.face{aspect-ratio:7/12;border-radius:4px;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-size:.6rem;text-align:center;line-height:1.2;flex:none}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face.r img{transform:rotate(180deg)}
.board{position:relative;width:100%;background:var(--soft);border-radius:12px;margin:0 auto}
.bwrap{display:flex;flex-direction:column;gap:6px}
.bmain{flex:1;min-width:0}
.mslot{flex:none;width:clamp(40px,11%,64px);position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:6px}
.mslot .face{width:100%;border:1px solid var(--rule);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.mslot .no{position:absolute;top:0;left:-5px;background:var(--hl);color:#fff;font-size:.6rem;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;z-index:2}
.mslot small{font-size:.65rem;color:var(--muted)}
.slot{position:absolute;transform:translate(-50%,-50%)}
.slot.x{transform:translate(-50%,-50%) rotate(90deg);z-index:2}
.slot .face{width:100%;box-shadow:0 1px 3px rgba(0,0,0,.2);border:1px solid var(--rule)}
.slot .no{position:absolute;top:-7px;left:-7px;background:var(--line);color:var(--panel);font-family:var(--num);font-size:.6rem;border-radius:999px;min-width:16px;height:16px;display:grid;place-items:center;padding:0 3px;z-index:3}
.slot .no{z-index:6}
.slot .auxf{position:absolute;width:78%;transform:rotate(16deg);transform-origin:center;z-index:4}
.slot .auxf .face{box-shadow:0 2px 5px rgba(0,0,0,.3);border:1.5px solid var(--hl)}
.slot .auxf.mf{width:62%;transform:rotate(-8deg);z-index:3}
.slot .auxf.mf .face{border-color:var(--accent)}
.mrow{border-left-color:color-mix(in srgb,var(--accent) 40%,transparent)}
.mrow .t{color:var(--accent)}
.slot.x .no{transform:rotate(-90deg)}
.side{display:flex;flex-direction:row;gap:12px;justify-content:flex-start;padding-left:4px}
.mslot.ins .no{background:var(--accent)}
.insrow{display:flex;flex-direction:column;gap:6px;border:1px dashed var(--accent);border-radius:12px;padding:10px;background:var(--panel)}
.insrow .from{font-size:.78rem;color:var(--muted)}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1.5px dashed var(--accent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:.82rem}
.laybar{display:flex;align-items:center;justify-content:center;gap:8px;font-size:.82rem;color:var(--muted)}
/* 新增 */
.tohb{align-self:flex-start;font-size:.85rem;font-weight:700;color:var(--line);border:1px solid var(--rule);border-radius:999px;padding:5px 14px;text-decoration:none;background:var(--panel);margin-top:-6px}
.cv .tohb{align-self:center;margin-top:4px}
.spn{margin-top:6px;font-size:.82rem;background:var(--soft);border-radius:10px;padding:6px 10px}.spn summary{cursor:pointer;font-weight:700;color:var(--line)}.spn p{margin:6px 0 0}
.view{display:flex;flex-direction:column;gap:14px}
.nav3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.nav3 button{border:1px solid var(--rule);background:var(--panel);border-radius:14px;padding:10px 4px;font-weight:700;font-size:.88rem;display:flex;flex-direction:column;align-items:center;gap:2px}
.nav3 b{font-size:1.2rem}
.mecard{border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--panel))}
.av.me{background:var(--accent)}
.av.ar{background:var(--muted)}
details.mo.arch>summary .m{font-size:1.2rem;min-width:30px}
.tip{display:block;font-size:.75rem;color:var(--muted);margin-top:2px}
.insinfo .from b{color:var(--hl);margin-left:2px}
.optv{border:1px solid var(--rule);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.opth{display:flex;gap:8px;align-items:center}
.ol{background:var(--line);color:var(--panel);border-radius:8px;min-width:28px;height:28px;padding:0 8px;display:grid;place-items:center;font-weight:900}
.optrow{display:flex;gap:10px;align-items:center;border:1px solid var(--rule);border-radius:12px;padding:10px}
.olbl{width:52px!important;flex:none;text-align:center;font-weight:900}
.osum{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.osum .mini{display:flex;gap:3px;flex-wrap:wrap}.osum .mini .face{width:20px}
.ob{display:flex;flex-direction:column;gap:6px}
.sfilter{justify-content:center}
.bars{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.bar1{display:grid;grid-template-columns:64px minmax(0,1fr) 72px;gap:8px;align-items:center;font-size:.85rem}
.bt{height:14px;background:var(--soft);border-radius:999px;overflow:hidden;display:flex}
.bt i{display:block;height:100%}
.bt:not(.stack) i{border-radius:999px}
.bn{font-family:var(--num);font-size:.78rem;color:var(--muted);text-align:right}
.legend2{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px;font-size:.78rem;color:var(--muted)}
.legend2 i,.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.tblw{overflow-x:auto;margin-top:8px}
.tbl{border-collapse:collapse;width:100%;font-size:.85rem}
.tbl th,.tbl td{border-bottom:1px solid var(--rule);padding:7px 6px;text-align:left;white-space:nowrap}
.tbl th{color:var(--muted);font-size:.78rem}
.tbl td.tc{white-space:normal;min-width:120px;font-size:.8rem}
.topc{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:8px}
.topc>div{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.topc .face{width:100%;max-width:56px}
.topc small{font-size:.72rem;line-height:1.3}
.fxh{margin:12px 0 6px;font-size:.95rem}
.fx{border-left:3px solid var(--rule);padding:4px 10px;margin-bottom:8px}
.fo{font-size:.88rem;color:var(--muted)}
.fn{font-size:.92rem;font-weight:700}
.chooser{display:flex;flex-direction:column;gap:6px}
/* 電腦版 */
html.lay-d .wrap{max-width:1100px}
html.lay-d #client .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
html.lay-d #client .cols>div{display:flex;flex-direction:column;gap:14px}
html.lay-d .months{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.lrow{display:flex;flex-direction:column;gap:14px}
.lrow:empty{display:none}
html.lay-d .lrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
html.lay-d .sheet .wrap{max-width:1100px}
html.lay-d .sgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
html.lay-d #sLeft{position:sticky;top:56px}
html.lay-d #sLeft .live{border:1px solid var(--rule);border-radius:16px;background:var(--panel);padding:14px}
.sgrid>div{display:flex;flex-direction:column;gap:12px}
#sLeft:empty{display:none}
html.lay-d .sheet .bar .btn{max-width:240px}
.plist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.plist li{display:flex;gap:10px;align-items:flex-start}
.plist .face{width:44px}
.plist .pn{font-family:var(--num);color:var(--line);font-weight:700;min-width:18px}
.plist .pt{flex:1;min-width:0}
.plist .pt small{display:block;color:var(--muted);font-size:.78rem;line-height:1.4}
.plist .aux{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.plist .aux span{display:flex;gap:5px;align-items:center;font-size:.8rem;background:var(--hl-bg);border-radius:8px;padding:3px 6px 3px 3px}
.plist .aux .face{width:22px}
.from{font-size:.78rem;color:var(--muted)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos a,.photos .ph{width:84px;height:84px;border-radius:10px;overflow:hidden;display:block;position:relative;background:var(--soft)}
.photos img{width:100%;height:100%;object-fit:cover}
.photos .ph button{position:absolute;top:3px;right:3px;border:0;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;width:22px;height:22px;font-size:.75rem}

/* 表單 sheet */
.sheet{position:fixed;inset:0;background:var(--bg);z-index:50;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 90px}
.sheet .wrap{gap:12px}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-16px;background:var(--bg);padding:10px 0;z-index:3}
.sheet .bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center;z-index:4}
.sheet .bar .btn{flex:1;max-width:300px}
.fs{display:flex;flex-direction:column;gap:10px}
.pos{border:1px solid var(--rule);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;background:var(--panel)}
.pos .ph2{display:flex;gap:8px;align-items:baseline}
.pos .ph2 b{font-family:var(--num);color:var(--line)}
.pos .ph2 span{font-size:.85rem;flex:1}
.pick{display:flex;gap:8px;align-items:center}
.pick .face{width:34px}
.pick select{flex:1}

    const mid=cardBy(a.s,(a.n+b.n)/2);if(!mid||have.has(mid.n)||seen.has(mid.n))continue;seen.add(mid.n);const lo=a.n<b.n?tc[i]:tc[j],hi=a.n<b.n?tc[j]:tc[i];const x={c:mid.n,from:[lo,hi],auto:true};insOrient(r,x);out.push(x)}

function setLay(v){LAYP=v;try{localStorage.setItem('case-layout',v)}catch(e){}applyLay();_lw=isDesk();refresh();toast(v==='auto'?'版面：自動':v==='d'?'版面：電腦版':'版面：手機版')}
let DB=null,ASSETS=null,CLIENTS=[],SESS=[],PUBS=[],SET={},READY={c:false,s:false,m:false,p:false},UNLOCK=false,VIEW='cover',CUR=null,TAB='rec',OPENM=new Set([new Date().getMonth()+1]),Q='';
const col=n=>DB.collection(n);
async function sha(t){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('zx-case:'+t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const ch of 'zx-case:'+t)h=(h*31+ch.charCodeAt(0))|0;return 'h'+h}}
const sessOf=id=>SESS.filter(s=>id==='__quick'?!s.clientId:s.clientId===id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||(b.ts||0)-(a.ts||0));
const clientOf=id=>id==='__quick'?QUICKC:CLIENTS.find(c=>c.id===id);
const selfC=()=>CLIENTS.find(c=>c.self);
const clientForS=s=>s.clientId?clientOf(s.clientId):QUICKC;
const isSelfS=s=>s.kind==='self'||!!(s.clientId&&(clientOf(s.clientId)||{}).self);
const activeClients=()=>CLIENTS.filter(c=>!c.self&&!c.archived);
const pending=()=>SESS.filter(s=>(s.follow||s.followDate)&&!s.followDone&&!((clientOf(s.clientId)||{}).archived)).sort((a,b)=>(a.followDate||'9999').localeCompare(b.followDate||'9999'));

/* ===== 封面 ===== */
function coverState(){
  const ok=READY.c&&READY.s&&READY.m&&READY.p;
  if(!DB)return;
  $('coverNote').textContent=ok?'':'讀取資料中…';
  $('pinBox').hidden=!(ok&&SET.pin);
  $('goBtn').disabled=!ok;
}
$('goBtn').onclick=async()=>{
  $('coverErr').textContent='';
  if(SET.pin){const v=$('pinIn').value.trim();if(!v){$('coverErr').textContent='請輸入密碼';return}if(await sha(v)!==SET.pin){$('coverErr').textContent='密碼不對，再試一次';$('pinIn').value='';return}}
  UNLOCK=true;$('pinIn').value='';show('list');consumePend();
};
$('pinIn').addEventListener('keydown',e=>{if(e.key==='Enter')$('goBtn').click()});

function show(v,id){VIEW=v;if(id!==undefined)CUR=id;['cover','list','client','pub','stats'].forEach(k=>$(k).hidden=v!==k);
  if(v==='list')renderList();if(v==='client')renderClient();if(v==='pub')renderPub();if(v==='stats')renderStats();window.scrollTo(0,0);}

/* ===== 個案列表 ===== */
function renderList(){
  const now=new Date(),cm=now.getMonth()+1,ym=today().slice(0,7);
  const mon=SESS.filter(s=>(s.date||'').startsWith(ym));const fee=mon.reduce((a,s)=>a+(+s.fee||0),0);
  const q=Q.trim().toLowerCase();
  const act=activeClients(),arch=CLIENTS.filter(c=>c.archived&&!c.self);
  const match=c=>!q||[c.name,c.contact,c.job,c.city,c.channel,c.archiveNote].join(' ').toLowerCase().includes(q);
  const list=act.filter(match);
  const pend=pending();const t=today();const me=selfC();
  const groups={};list.forEach(c=>{const m=c.solar?+c.solar.slice(5,7):0;(groups[m]=groups[m]||[]).push(c)});
  const bdays=act.filter(c=>c.solar&&+c.solar.slice(5,7)===cm).sort((a,b)=>a.solar.slice(8).localeCompare(b.solar.slice(8)));
  const qs=sessOf('__quick');
  let h=`<div class="top"><button class="iconbtn" id="lockBtn" aria-label="回到封面">🔒</button><h1>塔羅個案簿</h1><button class="iconbtn" id="setBtn" aria-label="設定">⚙︎</button></div>
  <a class="tohb" href="index.html">📖 回到牌義手冊</a>
  <div class="stat"><div><b>${act.length}</b><span>位個案</span></div><div><b>${mon.length}</b><span>本月占卜</span></div><div><b>${fee?'$'+fee.toLocaleString():'—'}</b><span>本月收入</span></div></div>
  <div class="nav3"><button id="quickBtn"><b>⚡</b>快速占卜</button><button id="pubBtn"><b>📣</b>大眾占卜</button><button id="statBtn"><b>📊</b>復盤統計</button></div>`;
  if(me&&!q){const ms=sessOf(me.id);h+=`<button class="cc mecard" data-open="${me.id}"><span class="av me">我</span><span class="t"><b>${esc(me.name)}</b><div class="s">我自己的占卜・${ms.length} 次${ms.length?`・上次 ${fmtD(ms[0].date)}`:''}</div></span><span class="tags">${ms.some(s=>(s.follow||s.followDate)&&!s.followDone)?'<span class="tag warn">待追蹤</span>':''}</span></button>`}
  h+=`<div class="row"><input id="q" type="search" placeholder="搜尋姓名、聯絡方式、職業…" value="${esc(Q)}" style="flex:1"><button class="btn pri" id="addC">＋ 新增個案</button></div>`;
  let side='';
  if(bdays.length&&!q)side+=`<div class="panel"><div class="sec-h"><h2>🎂 ${cm} 月壽星</h2><span class="hint">可以傳祝福或邀約流年占卜</span></div><div class="bday">${bdays.map(c=>`<button data-open="${c.id}"><b>${esc(c.name)}</b><small>${md(c.solar)}${c.solar.slice(5)===t.slice(5)?'・今天':''}</small></button>`).join('')}</div></div>`;
  if(pend.length&&!q)side+=`<div class="panel"><div class="sec-h"><h2>📌 待追蹤</h2><span class="hint">${pend.length} 筆</span></div><div class="fl">${pend.slice(0,8).map(s=>{const c=clientForS(s)||{};const late=s.followDate&&s.followDate<=t;
    return `<button class="fu${late?' late':''}" data-open="${s.clientId||'__quick'}" data-tab="rec"><span class="d">${s.followDate?md(s.followDate):'未定'}</span><span class="t"><b>${esc(s.clientId?(c.name||'（已刪除）'):'⚡ '+(s.guestName||'快速占卜'))}</b><span>${esc(s.follow||s.question||'')}</span></span></button>`}).join('')}</div></div>`;
  if(qs.length&&!q)side+=`<div class="panel"><div class="sec-h"><h2>⚡ 快速占卜紀錄</h2><button class="btn sm" data-open="__quick">查看全部 ${qs.length}</button></div><div class="fl">${qs.slice(0,3).map(s=>`<button class="fu" data-open="__quick"><span class="d">${md(s.date)}</span><span class="t"><b>${esc(s.guestName||'路人')}</b><span>${esc(s.question||spreadOf(s.spread).name)}</span></span></button>`).join('')}</div></div>`;
  if(side)h+=`<div class="lrow">${side}</div>`;
  h+=`<div class="months">`;
  for(let m=1;m<=12;m++){const arr=(groups[m]||[]).sort((a,b)=>a.solar.slice(8).localeCompare(b.solar.slice(8)));if(!arr.length&&q)continue;
    h+=`<details class="mo${m===cm?' cur':''}" data-m="${m}"${(q&&arr.length)||OPENM.has(m)?' open':''}><summary><span class="m">${m} 月</span><span class="n">${arr.length?arr.length+' 位':'—'}${m===cm?'・本月':''}</span></summary>${arr.length?`<div class="cl">${arr.map(ccard).join('')}</div>`:''}</details>`;}
  const nob=groups[0]||[];
  if(nob.length)h+=`<details class="mo" data-m="0"${q||OPENM.has(0)?' open':''}><summary><span class="m">未填</span><span class="n">${nob.length} 位・還沒填生日</span></summary><div class="cl">${nob.map(ccard).join('')}</div></details>`;
  h+=`</div>`;
  const archM=arch.filter(match);
  if(archM.length)h+=`<details class="mo arch"${q||OPENM.has(-1)?' open':''} data-m="-1"><summary><span class="m">📦</span><span class="n">已封存（${archM.length} 位）・不會出現在壽星、待追蹤裡</span></summary><div class="cl">${archM.map(ccard).join('')}</div></details>`;
  if(!act.length)h+=`<p class="note">還沒有個案。按「＋ 新增個案」開始第一筆吧！</p>`;
  h+=`<div class="laybar">版面<div class="seg">${[['auto','自動'],['m','手機版'],['d','電腦版']].map(([v,l])=>`<button type="button" data-lay="${v}" aria-pressed="${LAYP===v}">${l}</button>`).join('')}</div></div>`;
  $('list').innerHTML=h;
  const qi=$('q');qi.oninput=()=>{Q=qi.value;const p=qi.selectionStart;renderList();const n=$('q');n.focus();try{n.setSelectionRange(p,p)}catch(e){}};
}
function ccard(c){const ss=sessOf(c.id),n=ss.length,pend=ss.some(s=>(s.follow||s.followDate)&&!s.followDone);
  const bits=[c.solar?md(c.solar):'',zodiac(c.solar),c.city].filter(Boolean).join('・');
  return `<button class="cc" data-open="${c.id}"><span class="av${c.archived?' ar':''}">${esc((c.name||'?').slice(0,1))}</span><span class="t"><b>${esc(c.name)}</b><div class="s">${esc(bits)}${n?`・上次 ${fmtD(ss[0].date)}`:''}${c.archived&&c.archiveNote?`・${esc(c.archiveNote)}`:''}</div></span><span class="tags">${c.archived?'<span class="tag">已封存</span>':''}${n>1?`<span class="tag gold">回頭客 ×${n}</span>`:n?'<span class="tag">1 次</span>':''}${pend&&!c.archived?'<span class="tag warn">待追蹤</span>':''}</span></button>`;}

document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('mo')){const m=+d.dataset.m;d.open?OPENM.add(m):OPENM.delete(m)}},true);

/* ===== 個案檔案 ===== */
function renderClient(){
  if(CUR==='__quick'){const ss=sessOf('__quick');
    $('client').innerHTML=`<div class="top"><button class="iconbtn" id="backBtn" aria-label="返回列表">←</button><span></span><button class="btn sm pri" id="newQ">＋ 快速占卜</button></div>
    <div class="ch"><span class="av">⚡</span><div><h1>快速占卜</h1><p class="hint">不用建檔的路人紀錄。想留下資料時，按「轉成個案」。</p></div></div>
    ${ss.length?`<div class="tl">${ss.map((s,i)=>sessHTML(s,i===0)).join('')}</div>`:'<div class="panel note">還沒有快速占卜紀錄。</div>'}`;return}
  const c=clientOf(CUR);if(!c){show('list');return}

  ${c.archived?`<div class="confirm">📦 已封存${c.archiveNote?'：'+esc(c.archiveNote):''}<button class="btn sm" id="unarch">恢復</button></div>`:''}
  <div class="ch"><span class="av${c.self?' me':''}">${c.self?'我':esc((c.name||'?').slice(0,1))}</span><div><h1>${esc(c.name)}${c.self?' <span class="tag gold">我自己</span>':''}</h1><div class="chips" style="margin-top:4px">${[c.solar?`<span class="tag">${zodiac(c.solar)}座</span>`:'',shengxiao(c)?`<span class="tag">屬${shengxiao(c)}</span>`:'',pn?`<span class="tag gold">${pn} 號人</span>`:'',ageOf(c)!==''?`<span class="tag">${ageOf(c)} 歲</span>`:'',ss.length?`<span class="tag ${ss.length>1?'gold':''}">${c.self?'占卜':'來訪'} ${ss.length} 次</span>`:''].join('')}</div></div></div>
`;
  if(isDesk()){h+=`<div class="cols"><div>${infoHTML(c)}${numHTML(c)}</div><div><div class="sec-h"><h2>${c.self?'占卜紀錄':'諮詢紀錄'}</h2></div>${recHTML(c,ss)}</div></div>`}
  else{h+=`<div class="tabs" role="tablist">${[['info','基本資料'],['rec',c.self?'占卜紀錄':'諮詢紀錄'],['num','靈數']].map(([k,t])=>`<button role="tab" data-tab2="${k}" aria-selected="${TAB===k}">${t}</button>`).join('')}</div>`;

function infoHTML(c){
  const row=(k,v)=>v!==''&&v!=null?`<dt>${k}</dt><dd>${esc(v)}</dd>`:'';
  return `<div class="panel"><div class="sec-h"><h2>基本資料</h2><button class="btn sm" id="editC">編輯</button></div>
  <dl class="kv">${row('姓名',c.name)}${row('年紀',ageOf(c)===''?'':ageOf(c)+' 歲')}${row('職業',c.job)}${row('縣市',c.city)}${row('星座',c.solar?zodiac(c.solar)+'座':'')}${row('生肖',shengxiao(c))}${row('國曆生日',fmtD(c.solar))}${row('農曆生日',lunarTxt(c.lunar))}${row('聯絡方式',c.contact)}${row('認識管道',c.channel)}${row('第一次見面',c.firstPlace)}</dl></div>
  <div class="panel"><h3 style="margin-bottom:6px">主訴</h3><div class="box">${esc(c.complaint||'')||'<span style="color:var(--muted)">還沒填</span>'}</div></div>
  <div class="panel"><h3 style="margin-bottom:6px">家庭背景／概況</h3><div class="box">${esc(c.family||'')||'<span style="color:var(--muted)">還沒填</span>'}</div></div>
  <div class="panel"><h3 style="margin-bottom:6px">其他備註</h3><div class="box">${esc(c.memo||'')||'<span style="color:var(--muted)">還沒填</span>'}</div></div>`;

function recHTML(c,ss){
  if(!ss.length)return `<div class="panel note">還沒有${c.self?'占卜':'諮詢'}紀錄。按右上角「＋ 這次占卜」新增。</div>`;
  return `<div class="tl">${ss.map((s,i)=>sessHTML(s,i===0)).join('')}</div>`;
}
function sessHTML(s,open){
  const sp=spreadOf(s.spread),labels=posLabels(s),cards=s.cards||[];
  const late=s.followDate&&!s.followDone&&s.followDate<=today();
  const me=isSelfS(s);
  let h=`<details class="ss"${open?' open':''}><summary><div class="h"><span class="d">${fmtD(s.date)}</span>${!s.clientId?`<span class="tag gold">⚡ ${esc(s.guestName||'路人')}</span>`:''}${s.place?`<span class="tag">📍${esc(s.place)}</span>`:''}${s.qtype?`<span class="tag">${esc(s.qtype)}</span>`:''}<span class="tag">${esc(sp.name)}</span>${s.react?`<span class="tag ${s.react==='很有共鳴'?'ok':''}">${esc(s.react)}</span>`:''}${s.verify?`<span class="tag ${s.verify==='應驗'?'ok':s.verify==='沒有應驗'?'warn':'gold'}">${esc(s.verify)}</span>`:''}${(s.follow||s.followDate)&&!s.followDone?`<span class="tag warn">待追蹤${s.followDate?' '+md(s.followDate):''}</span>`:''}</div>
  <div class="q">${s.question?'「'+esc(s.question)+'」':'<span style="color:var(--muted)">（沒有記問句）</span>'}</div>
  <div class="mini">${cards.filter(c=>c.c).map(c=>face(c)).join('')}</div></summary><div class="bd">`;
  if(s.questionFix)h+=`<div><div class="lbl">✏️ 問句修正</div><div class="box">${esc(s.questionFix)}</div></div>`;
  if(s.mind&&s.mind.c)h+=`<div class="hint">心態牌：${cname(s.mind)}</div>`;
  if((s.ins||[]).some(x=>x.c))h+=`<div class="hint">插牌：${s.ins.filter(x=>x.c).map(insTxt).join('、')}</div>`;
  if(cards.some(c=>c.c)||(s.mind&&s.mind.c)||(s.ins||[]).some(x=>x.c))h+=`<div>${boardHTML(s)}</div>`;
  h+=`<ul class="plist">${cards.map((c,i)=>`<li><span class="pn">${i+1}</span>${face(c)}<div class="pt">${cname(c)}<small>${esc(labels[i]||'')}</small>${(c.aux||[]).filter(a=>a.c).length?`<div class="aux">${c.aux.filter(a=>a.c).map(a=>`<span>${face(a)}${a.m?'心態':'輔助'}：${cname(a)}</span>`).join('')}</div>`:''}</div></li>`).join('')}</ul>`;
  if(s.photos&&s.photos.length)h+=`<div><div class="lbl">牌面照片</div><div class="photos">${s.photos.map(p=>`<a href="/_blob/${esc(p)}" target="_blank" rel="noopener"><img src="/_blob/${esc(p)}" alt="牌面照片" loading="lazy"></a>`).join('')}</div></div>`;
  if(s.reading)h+=`<div><div class="lbl">解讀筆記</div><div class="box">${esc(s.reading)}</div></div>`;
  if(s.react||s.reactNote)h+=`<div><div class="lbl">${me?'當下感受':'當下反饋'}${s.react?'：'+esc(s.react):''}</div>${s.reactNote?`<div class="box">${esc(s.reactNote)}</div>`:''}</div>`;
  if(s.verify||s.verifyNote)h+=`<div><div class="lbl">事後驗證${s.verify?'：'+esc(s.verify):''}</div>${s.verifyNote?`<div class="box">${esc(s.verifyNote)}</div>`:''}</div>`;
  if(s.follow||s.followDate)h+=`<div><div class="lbl">備註／下次追蹤${s.followDate?'（'+fmtD(s.followDate)+'）':''}${s.followDone?' ✅ 已追蹤':''}</div>${s.follow?`<div class="box">${esc(s.follow)}</div>`:''}</div>`;
  if(s.fee||s.feeN)h+=`<div class="hint">收費：${feeTxt(s)}${s.fee?'$'+(+s.fee).toLocaleString():''}</div>`;
  h+=`<div class="row">${(s.follow||s.followDate)&&!s.followDone?`<button class="btn sm" data-done="${s.id}">標記已追蹤</button>`:''}<button class="btn sm" data-edits="${s.id}">編輯／補反饋</button>${!s.clientId?`<button class="btn sm" data-conv="${s.id}">轉成個案</button>`:''}<button class="btn sm ghost" data-dels="${s.id}">刪除</button></div><div data-confirm="${s.id}"></div></div></details>`;
  return h;
}
function numHTML(c){
  if(!c.solar)return `<div class="panel note">填了國曆生日，這裡就會自動出現九宮格和七秒讀心數。<br><button class="btn sm" id="editC" style="margin-top:8px">去填生日</button></div>`;
  const [y,m,d]=c.solar.split('-').map(Number),ln=lifeNums(y,m,d),p=pyramid(y,m,d);
  let h=`<div class="nums"><div><b>${ln.shown}</b><span>後天數</span></div><div><b>${ln.main}</b><span>主命數</span></div><div><b>${p.top}</b><span>幾號人</span></div></div>
  <div class="panel"><h2>國曆九宮格</h2><div class="legend"><span class="lg-pre">○ 先天數</span><span class="lg-post">△ 後天數</span><span class="lg-main">□ 主命數</span></div><div class="grid9">${gridHTML(y,m,d,ln)}</div></div>`;
  const L=c.lunar;
  if(L&&L.y){const ll=lifeNums(L.y,L.m,L.d);h+=`<details class="panel fold"><summary>農曆九宮格（${L.y}/${L.m}/${L.d}）</summary><div class="legend"><span class="lg-pre">○ 先天數</span><span class="lg-post">△ 後天數</span><span class="lg-main">□ 主命數</span></div><div class="grid9">${gridHTML(L.y,L.m,L.d,ll)}</div><p class="hint" style="text-align:center">農曆後天數 ${ll.shown}・主命數 ${ll.main}</p></details>`;}
  h+=`<div class="panel"><h2>七秒讀心數</h2><svg class="pyr" viewBox="0 0 400 350" role="img" aria-label="七秒讀心數">${pyrSVG(p,y,m,d)}</svg><p class="hint" style="text-align:center">完整解讀請到靈數羅盤查看。多胞胎校正不在這裡計算。</p></div>`;
  return h;
}

/* ===== 點擊處理 ===== */
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-open]');if(!t)return;
  if(t.dataset.open){CUR=t.dataset.open;TAB=t.dataset.tab||'rec';show('client');return}
  if(t.dataset.lay){setLay(t.dataset.lay);return}
  if(t.id==='lockBtn'){UNLOCK=false;show('cover');return}
  if(t.id==='setBtn'){openSettings();return}
  if(t.id==='addC'){openClientForm(null);return}
  if(t.id==='backBtn'){show('list');return}
  if(t.dataset.tab2){TAB=t.dataset.tab2;renderClient();return}
  if(t.id==='editC'){openClientForm(clientOf(CUR));return}
  if(t.id==='newS'){openSessForm(clientOf(CUR),null);return}
  if(t.id==='quickBtn'||t.id==='newQ'){openSessForm(QUICKC,null);return}
  if(t.id==='pubBtn'){show('pub');return}
  if(t.id==='statBtn'){show('stats');return}
  if(t.id==='newPub'){openPubForm(null);return}
  if(t.dataset.sf){SF=t.dataset.sf;renderStats();return}
  if(t.dataset.editp){openPubForm(PUBS.find(p=>p.id===t.dataset.editp));return}
  if(t.dataset.delp){document.querySelector(`[data-confirmp="${t.dataset.delp}"]`).innerHTML=`<div class="confirm">確定刪除這篇大眾占卜？<button class="btn sm danger" data-delpok="${t.dataset.delp}">刪除</button></div>`;return}
  if(t.dataset.delpok){t.disabled=true;try{await col('publics').doc(t.dataset.delpok).delete();toast('已刪除')}catch(err){toast('刪除失敗');t.disabled=false}return}

function spreadOptions(cur){return SPREADS.filter(p=>!p.hidden||p.id===cur).map(p=>`<option value="${p.id}"${p.id===cur?' selected':''}>${esc(p.name)}${p.count?'（'+p.count+'）':''}</option>`).join('')}

function bindDrawSection(){if(isDesk()&&$('sLeft'))$('sLeft').appendChild($('liveBox'));$('sSpread').onchange=()=>{F.spread=$('sSpread').value;fitCards();drawPos()};drawPos()}
function blankDraw(spread){return {spread:spread||'time',cards:[],labels:[],mind:{c:'',r:false},ins:[]}}
function normDraw(o){if(!o.mind)o.mind={c:'',r:false};if(!o.labels)o.labels=[];if(!o.ins)o.ins=[];if(!o.cards)o.cards=[];return o}
function cleanDraw(o){const sp=spreadOf(o.spread);
  o.cards=o.cards.map(c=>({c:c.c,r:!!c.r,aux:(c.aux||[]).filter(a=>a.c).map(a=>a.m?{c:a.c,r:!!a.r,m:true}:{c:a.c,r:!!a.r})}));
  if(sp.id!=='self')o.labels=[];
  o.ins=(o.ins||[]).filter(x=>x.c).map(x=>{insOrient(o,x);return {c:x.c,r:!!x.r,from:x.from||[],fromR:x.fromR||null,auto:!!x.auto}});
  o.posNames=sp.id==='self'?o.labels.map((l,i)=>l||('第 '+(i+1)+' 張')):(o.posNames&&o.posNames.length&&sp.hidden?o.posNames:sp.pos.slice());
  delete o._excl;return o}

function fitCards(){const sp=spreadOf(F.spread);const n=sp.id==='self'?Math.max(F.cards.length,F.labels.length,1):sp.pos.length;
  while(F.cards.length<n)F.cards.push({c:'',r:false,aux:[]});if(sp.id!=='self')F.cards.length=n;F.cards.forEach(c=>{if(!c.aux)c.aux=[];if(sp.perMind){if(!c.aux.some(a=>a.m))c.aux.unshift({c:'',r:false,m:true})}else c.aux=c.aux.filter(a=>!a.m)});
  if(sp.id==='self')while(F.labels.length<F.cards.length)F.labels.push('');}
function picker(c,attrs,noRev){return `<div class="pick" ${attrs}>${face(c)}<select data-k="c"></select>${noRev?'':`<button type="button" class="rv" data-k="r" aria-pressed="${!!c.r}">逆位</button>`}</div>`}
function drawPos(){
  {const sp0=spreadOf(F.spread),el=$('spNote');if(el)el.innerHTML=sp0.use||sp0.ex?`<details class="spn"><summary>📖 牌陣說明</summary>${sp0.use?`<p><b>使用時機</b>：${esc(sp0.use)}</p>`:''}${sp0.ex?`<p><b>${sp0.id==='tree'?'組合':'問題範例'}</b>：${esc(sp0.ex)}</p>`:''}</details>`:''}

  <div class="seg sfilter">${[['all','全部'],['client','客人'],['self','我自己'],['public','大眾占卜']].map(([v,l])=>`<button type="button" data-sf="${v}" aria-pressed="${SF===v}">${l}（${v==='all'?all.length:all.filter(r=>r.kind===v).length}）</button>`).join('')}</div>`;
  if(!R.length){$('stats').innerHTML=h+`<div class="panel note">這個分類還沒有紀錄。</div>`;return}
  const reacted=R.filter(r=>r.react),ym=today().slice(0,7);
  h+=`<div class="stat"><div><b>${R.length}</b><span>場次</span></div><div><b>${R.filter(r=>r.date.startsWith(ym)).length}</b><span>本月</span></div><div><b>${pct(reacted.filter(r=>r.react==='很有共鳴').length,reacted.length)}</b><span>很有共鳴</span></div><div><b>${pct(R.filter(hit).length,R.filter(vr).length)}</b><span>應驗率</span></div></div>`;
  const cnt=t=>R.filter(r=>r.qtype===t).length,mx=Math.max(...types.map(cnt));
  h+=`<div class="panel"><h2>各類問題分布</h2>${SF==='self'?'<p class="hint">你最近最常問自己的，可能就是當下最在意的課題。</p>':''}<div class="bars">${types.map(t=>`<div class="bar1"><span class="bl">${esc(t)}</span><span class="bt"><i style="width:${cnt(t)/mx*100}%;background:${col(t)}"></i></span><span class="bn">${cnt(t)}・${pct(cnt(t),R.length)}</span></div>`).join('')}</div></div>`;
  const months=[...new Set(R.map(r=>r.date.slice(0,7)).filter(Boolean))].sort().slice(-6);
  if(months.length)h+=`<div class="panel"><h2>每月變化</h2><p class="hint">近 ${months.length} 個月，各類問題的比例</p><div class="bars">${months.map(m=>{const mr=R.filter(r=>r.date.startsWith(m));return `<div class="bar1"><span class="bl">${m.slice(2).replace('-','/')}</span><span class="bt stack">${types.map(t=>{const n=mr.filter(r=>r.qtype===t).length;return n?`<i style="width:${n/mr.length*100}%;background:${col(t)}" title="${esc(t)} ${n}"></i>`:''}).join('')}</span><span class="bn">${mr.length} 場</span></div>`}).join('')}</div><div class="legend2">${types.map(t=>`<span><i style="background:${col(t)}"></i>${esc(t)}</span>`).join('')}</div></div>`;
  h+=`<div class="panel"><h2>各類問題的表現</h2><div class="tblw"><table class="tbl"><tr><th>問題類型</th><th>場次</th><th>很有共鳴</th><th>應驗率</th><th>常出現的牌</th></tr>${types.map(t=>{const tr=R.filter(r=>r.qtype===t),re=tr.filter(r=>r.react);const cc=new Map();tr.forEach(r=>r.cards.forEach(c=>cc.set(c,(cc.get(c)||0)+1)));const top=[...cc.entries()].sort((a,b)=>b[1]-a[1]).slice(0,3);
    return `<tr><td><i class="dot" style="background:${col(t)}"></i>${esc(t)}</td><td>${tr.length}</td><td>${pct(re.filter(r=>r.react==='很有共鳴').length,re.length)}</td><td>${pct(tr.filter(hit).length,tr.filter(vr).length)}</td><td class="tc">${top.map(([c,n])=>`${esc(c)}${n>1?'×'+n:''}`).join('、')||'—'}</td></tr>`}).join('')}</table></div></div>`;
  const cc=new Map();R.forEach(r=>r.cards.forEach(c=>cc.set(c,(cc.get(c)||0)+1)));const topc=[...cc.entries()].sort((a,b)=>b[1]-a[1]).slice(0,10);
  if(topc.length)h+=`<div class="panel"><h2>最常出現的牌</h2><div class="topc">${topc.map(([c,n])=>`<div>${face({c})}<small>${esc(c)}<br>×${n}</small></div>`).join('')}</div></div>`;
  const fx=R.filter(r=>r.fix);
  if(fx.length)h+=`<div class="panel"><h2>✏️ 問句修正回顧</h2>${types.filter(t=>fx.some(r=>r.qtype===t)).map(t=>`<h3 class="fxh"><i class="dot" style="background:${col(t)}"></i>${esc(t)}</h3>${fx.filter(r=>r.qtype===t).map(r=>`<div class="fx"><div class="hint">${fmtD(r.date)}・${esc(r.who)}</div><div class="fo">原本：${esc(r.q||'（沒記）')}</div><div class="fn">修正：${esc(r.fix)}</div></div>`).join('')}`).join('')}</div>`;
  $('stats').innerHTML=h;
}

/* ===== 從手冊帶牌陣過來：選記錄對象 ===== */
let PEND_SP=null;
function readHash(){const m=(location.hash||'').match(/^#rec-([a-z0-9]+)$/);if(m&&SPREADS.some(s=>s.id===m[1]))PEND_SP=m[1]}
function openChooser(sp){const s=spreadOf(sp);const me=selfC();const cs=activeClients().sort((a,b)=>(b.updated||0)-(a.updated||0));
  openSheet(`<div class="wrap"><div class="sh"><h2>用「${esc(s.name)}」記錄給誰？</h2><button class="iconbtn" id="chx">✕</button></div>
  <div class="panel fs"><div class="chooser">${me?`<button class="cc" data-pick="${me.id}"><span class="av me">我</span><span class="t"><b>我自己</b></span></button>`:''}<button class="cc" data-pick="__quick"><span class="av">⚡</span><span class="t"><b>快速占卜（路人）</b><div class="s">不用建檔</div></span></button></div></div>
  <div class="panel fs"><h3>客人</h3><input id="chq" type="search" placeholder="搜尋姓名"><div class="chooser" id="chl"></div><button class="btn sm" id="chNew" style="align-self:flex-start">＋ 新增個案</button></div></div>`);
  const draw=()=>{const q=$('chq').value.trim().toLowerCase();$('chl').innerHTML=cs.filter(c=>!q||c.name.toLowerCase().includes(q)).slice(0,30).map(c=>`<button class="cc" data-pick="${c.id}"><span class="av">${esc(c.name.slice(0,1))}</span><span class="t"><b>${esc(c.name)}</b><div class="s">${esc([c.solar?md(c.solar):'',c.city].filter(Boolean).join('・'))}</div></span></button>`).join('')||'<p class="hint">沒有符合的客人</p>'};draw();$('chq').oninput=draw;
  $('chx').onclick=closeSheet;$('chNew').onclick=()=>{closeSheet();openClientForm(null,{goSpread:sp})};
  sheet.querySelectorAll('.chooser').forEach(el=>el.onclick=e=>{const b=e.target.closest('[data-pick]');if(!b)return;const id=b.dataset.pick;closeSheet();const c=id==='__quick'?QUICKC:clientOf(id);CUR=id;TAB='rec';show('client');openSessForm(c,null,{spread:sp})});
}
function consumePend(){if(!PEND_SP||!UNLOCK)return;const sp=PEND_SP;PEND_SP=null;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){try{location.hash=''}catch(_){}}openChooser(sp)}
window.addEventListener('hashchange',()=>{readHash();consumePend()});

/* ===== 設定 ===== */
function openSettings(){
  openSheet(`<div class="wrap"><div class="sh"><h2>設定</h2><button class="iconbtn" id="tx">✕</button></div>
  <div class="panel fs"><h3>封面密碼</h3><p class="hint">${SET.pin?'目前有設定密碼。':'目前沒有密碼，按「開始」就能進入。'}資料本來就只有你登入的帳號看得到，密碼是防止手機放桌上時被旁人點開。</p>
    <input id="pin1" type="password" inputmode="numeric" maxlength="8" placeholder="新密碼（4–8 位數字）"><div class="row"><button class="btn sm pri" id="pinSave">設定密碼</button>${SET.pin?'<button class="btn sm ghost" id="pinDel">取消密碼</button>':''}</div><p class="hint" id="pinMsg"></p></div>
  <div class="panel fs"><h3>常用地點</h3><p class="hint">填過的地點會自動記住，點 ✕ 可以移除。</p><div class="chips" id="plc">${(SET.places||[]).map((p,i)=>`<span class="chip">${esc(p)} <button type="button" class="x" data-rmset="places-${i}" style="padding:0 2px">✕</button></span>`).join('')||'<span class="hint">還沒有</span>'}</div></div>
  <div class="panel fs"><h3>💾 備份</h3><p class="hint">資料只存在這台裝置的瀏覽器裡。換手機、換瀏覽器或清除瀏覽資料就會不見，記得定期匯出。換裝置時，在新裝置匯入備份檔就能接著用。</p>
    <div class="row"><button class="btn sm pri" id="bkOut">匯出備份</button><label class="btn sm">匯入備份<input id="bkIn" type="file" accept=".json,application/json" hidden></label></div><p class="hint" id="bkMsg"></p></div>
  <div class="panel fs"><h3>📖 塔羅牌義手冊</h3><a class="btn sm" href="index.html" style="align-self:flex-start;text-decoration:none">打開牌義手冊</a></div>
  <div class="panel fs"><h3>認識管道</h3><div class="chips">${(SET.channels||[]).map((p,i)=>`<span class="chip">${esc(p)} <button type="button" class="x" data-rmset="channels-${i}" style="padding:0 2px">✕</button></span>`).join('')||'<span class="hint">還沒有</span>'}</div></div>
  </div>`);
  $('tx').onclick=closeSheet;
  $('bkOut').onclick=()=>{try{exportBackup();$('bkMsg').textContent='已匯出，請把檔案存到雲端硬碟或傳給自己保存。'}catch(e){$('bkMsg').textContent='匯出失敗'}};
  $('bkIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{await importBackup(f);$('bkMsg').textContent='已匯入備份。'}catch(err){$('bkMsg').textContent='匯入失敗：'+(err&&err.message||'檔案格式不對')}};
  $('pinSave').onclick=async()=>{const v=$('pin1').value.trim();if(!/^\d{4,8}$/.test(v)){$('pinMsg').textContent='請輸入 4–8 位數字';return}SET.pin=await sha(v);try{await col('meta').doc('settings').set(SET);$('pinMsg').textContent='已設定，下次回到封面要輸入密碼。';$('pin1').value=''}catch(e){$('pinMsg').textContent='儲存失敗'}};
  if($('pinDel'))$('pinDel').onclick=async()=>{delete SET.pin;try{await col('meta').doc('settings').set(SET);openSettings();toast('已取消密碼')}catch(e){}};
  sheet.onclick=async e=>{const b=e.target.closest('[data-rmset]');if(!b)return;const [k,i]=b.dataset.rmset.split('-');SET[k]=(SET[k]||[]).filter((_,j)=>j!==+i);try{await col('meta').doc('settings').set(SET)}catch(err){}openSettings()};
}
const _close=closeSheet;closeSheet=function(){sheet.onclick=null;F=null;_close()};

/* ===== 本機儲存（朋友版） ===== */
const LDB=(()=>{const K='zxcase:';const subs={};
  const load=c=>{try{return JSON.parse(localStorage.getItem(K+c)||'{}')}catch(e){return {}}};
  const save=(c,m)=>{try{localStorage.setItem(K+c,JSON.stringify(m))}catch(e){throw {message:'瀏覽器空間不足或無法儲存'}}};
  const fire=c=>{const m=load(c);const snap={docs:Object.entries(m).map(([id,d])=>({id,data:()=>JSON.parse(JSON.stringify(d))})),metadata:{fromCache:false}};(subs[c]||[]).forEach(f=>{try{f(snap)}catch(e){console.error(e)}})};
  return {collection:c=>({onSnapshot:(f)=>{(subs[c]=subs[c]||[]).push(f);setTimeout(()=>fire(c),0)},
    doc:id=>({set:async d=>{const m=load(c);m[id]=JSON.parse(JSON.stringify(d));save(c,m);fire(c)},update:async d=>{const m=load(c);m[id]=Object.assign(m[id]||{},JSON.parse(JSON.stringify(d)));save(c,m);fire(c)},delete:async()=>{const m=load(c);delete m[id];save(c,m);fire(c)}})}),
    dump:()=>{const o={};['clients','sessions','publics','meta'].forEach(c=>o[c]=load(c));return o},
    restore:o=>{['clients','sessions','publics','meta'].forEach(c=>{if(o&&o[c]&&typeof o[c]==='object')save(c,o[c])});['clients','sessions','publics','meta'].forEach(fire)}}})();
function exportBackup(){const data={app:'芝心聊癒塔羅個案簿',version:1,exported:new Date().toISOString(),data:LDB.dump()};const blob=new Blob([JSON.stringify(data)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='tarot-case-backup-'+today()+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
async function importBackup(file){const txt=await file.text();const o=JSON.parse(txt);if(!o||!o.data||!o.data.clients)throw new Error('這不是個案簿的備份檔');LDB.restore(o.data)}

/* ===== 連線 ===== */
function refresh(){if(!sheet.hidden){coverState();return}if(VIEW==='list')renderList();else if(VIEW==='client')renderClient();else if(VIEW==='pub')renderPub();else if(VIEW==='stats')renderStats();coverState()}
(async()=>{
  DB=LDB;ASSETS=null;try{localStorage.setItem('zxcase:test','1');localStorage.removeItem('zxcase:test')}catch(e){$('coverNote').textContent='這個瀏覽器不能儲存資料（可能是無痕模式），請換一般模式開啟。';return}
  coverState();
  const t=setTimeout(()=>{if(!(READY.c&&READY.s&&READY.m&&READY.p))$('coverNote').textContent='連線比較慢，請稍等或重新整理。'},10000);
  const fail=e=>{clearTimeout(t);$('coverNote').textContent='讀取失敗（'+(e&&e.code||e&&e.message||'未知錯誤')+'），請重新整理。'};
  col('clients').onSnapshot(s=>{CLIENTS=s.docs.map(d=>d.data());READY.c=true;ensureSelf();refresh()},fail);
  col('publics').onSnapshot(s=>{PUBS=s.docs.map(d=>d.data());READY.p=true;refresh()},fail);
  col('sessions').onSnapshot(s=>{SESS=s.docs.map(d=>d.data());READY.s=true;refresh()},fail);
  col('meta').onSnapshot(s=>{const d=s.docs.find(x=>x.id==='settings');SET=d?d.data():{};READY.m=true;refresh()},fail);
})();
window.addEventListener('lunarready',()=>{});
let SELF_TRIED=false;
async function ensureSelf(){if(SELF_TRIED||selfC())return;SELF_TRIED=true;const d={id:'self',name:'我自己',self:true,created:Date.now(),updated:Date.now()};try{await col('clients').doc('self').set(d)}catch(e){SELF_TRIED=false}}
readHash();
</script>
